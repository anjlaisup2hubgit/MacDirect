<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iMCQ - Log in</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>iMCQ</h1>
    <p class="auth-tagline">Your Macquarie campus map</p>

    <div class="auth-tabs" role="tablist">
      <button type="button" role="tab" class="chip active" data-mode="login">Log in</button>
      <button type="button" role="tab" class="chip" data-mode="signup">Sign up</button>
    </div>

    <form class="event-form" id="auth-form">
      <label data-signup hidden>Display name<input name="displayName" maxlength="40" autocomplete="nickname"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
      <div data-signup hidden class="auth-leader">
        <label class="auth-check"><input type="checkbox" name="isLeader"> I lead a society (an admin will approve this)</label>
        <label data-leader hidden>Society<select name="societyId"></select></label>
      </div>
      <button class="form-submit" type="submit">Log in</button>
      <p class="form-msg" hidden></p>
    </form>

    <button class="auth-guest" type="button">Continue as guest</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/lib/auth.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
