<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iMCQ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>
  <div id="search-bar-mount"></div>
  <div id="societies-popup" class="societies-popup" hidden>
    <div class="popup-island">
      <div class="popup-head">
        <h1 data-i18n="On-campus Societies">On-campus Societies</h1>
        <button class="popup-close" type="button" aria-label="Close" data-i18n-attr="aria-label:Close">&times;</button>
      </div>
      <input class="page-search" type="search" placeholder="Search societies" aria-label="Search societies" data-i18n-attr="placeholder:Search societies|aria-label:Search societies" autocomplete="off">
      <div class="chips" role="group" aria-label="Filter by category" data-i18n-attr="aria-label:Filter by category"></div>
    </div>
    <div class="popup-results">
      <ul class="card-list"></ul>
      <p class="empty-msg" hidden data-i18n="No societies found.">No societies found.</p>
    </div>
  </div>
  <div id="food-popup" class="societies-popup" hidden>
    <div class="popup-island">
      <div class="popup-head">
        <h1 data-i18n="Food and Drinks">Food and Drinks</h1>
        <button class="popup-close" type="button" aria-label="Close" data-i18n-attr="aria-label:Close">&times;</button>
      </div>
      <input class="page-search" type="search" placeholder="Search food and drinks" aria-label="Search food and drinks" data-i18n-attr="placeholder:Search food and drinks|aria-label:Search food and drinks" autocomplete="off">
      <div class="chips" role="group" aria-label="Filter by category" data-i18n-attr="aria-label:Filter by category"></div>
    </div>
    <div class="popup-results">
      <ul class="card-list"></ul>
      <p class="empty-msg" hidden data-i18n="No food outlets found.">No food outlets found.</p>
    </div>
  </div>
  <nav id="nav-mount"></nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/lib/i18n.js"></script>
  <script src="js/lib/auth.js"></script>
  <script src="js/lib/api.js"></script>
  <script src="js/components/nav.js"></script>
  <script src="js/components/search-bar.js"></script>
  <script src="js/components/card.js"></script>
  <script src="js/pages/map.js"></script>
  <script src="js/pages/societies.js"></script>
  <script src="js/pages/food.js"></script>
  <script src="js/components/popup.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/events.js"></script>
  <script src="js/pages/event-plan.js"></script>
</body>
</html>
