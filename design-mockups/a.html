<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.day{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 20px 10px}
.card{margin:0 12px 18px;background:#fff;border-radius:24px;box-shadow:0 8px 24px rgba(80,30,60,.08);overflow:hidden}
.band{height:10px;background:repeating-linear-gradient(135deg,#BDEFE6 0 12px,#d9f7f1 12px 24px)}
.body{padding:18px}
.chip{display:inline-block;background:#FDE3EC;color:#B3225A;font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px}
.card h2{font-size:25px;margin:10px 0 4px;line-height:1.15}
.desc{font-size:15px;color:var(--muted);line-height:1.4}
.rows{margin:16px 0 14px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:12px;align-items:center;font-size:15.5px;font-weight:600}
.row .ic{color:var(--muted)}
.row small{display:block;font-weight:500;color:var(--muted);font-size:13.5px;margin-top:1px}
.row.leave,.row.leave .ic{color:var(--link)}
.know{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.pill{display:flex;align-items:center;gap:7px;border-radius:99px;padding:8px 12px;font-size:13.5px;font-weight:600}
.p1{background:var(--wash);color:#3B1A6E}.p2{background:#DDF4F4;color:#0E6A73}
.acts{display:flex;gap:10px;margin-top:16px}
.btn{height:50px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.go{flex:1.5;background:var(--grad);color:#fff}
.going{flex:1;border:2px solid #3B1A6E;color:#3B1A6E;background:#fff}
.add{width:50px;border:2px solid var(--line);background:#fff;color:var(--link)}
</style>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="clk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
<symbol id="walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2-6-2-3 1-5 3 2 2 3h3M11 15l3 2 1 4M10 7L7 10"/></symbol>
<symbol id="acc" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8"/><path d="M12 8v6h5l2 5M12 11h5M9 13a5 5 0 105 7"/></symbol>
<symbol id="wat" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></symbol>
<symbol id="cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M12 13v4M10 15h4"/></symbol>
<symbol id="chk" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
</defs></svg>

<div class="top"><h1>Calendar</h1><svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="#1A1220" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 10H3M10 3L3 10l7 7"/></svg></div>

<div class="day">Mon, 9 Nov</div>
<div class="card"><div class="band"></div><div class="body">
  <span class="chip">Social</span>
  <h2>Sample Welcome BBQ</h2>
  <p class="desc">Free sausage sizzle and live music on the lawn.</p>
  <div class="rows">
    <div class="row"><svg class="ic"><use href="#clk"/></svg><div>12:00pm</div></div>
    <div class="row"><svg class="ic"><use href="#pin"/></svg><div>1 Central Courtyard</div></div>
    <div class="row leave"><svg class="ic"><use href="#walk"/></svg><div>Leave by 11:52am<small>8 min walk from the station</small></div></div>
  </div>
  <div class="know">
    <div class="pill p1"><svg class="ic"><use href="#acc"/></svg>3 lifts · 1 accessible toilet</div>
    <div class="pill p2"><svg class="ic"><use href="#wat"/></svg>Water 50 m away</div>
  </div>
  <div class="acts">
    <div class="btn go">Get directions</div>
    <div class="btn going"><svg class="ic"><use href="#chk"/></svg>Going · 1</div>
    <div class="btn add"><svg class="ic"><use href="#cal"/></svg></div>
  </div>
</div></div>

<div class="day">Tue, 10 Nov</div>
<div class="card"><div class="band" style="background:repeating-linear-gradient(135deg,#F6B6CC 0 12px,#fbd3e1 12px 24px)"></div></div>

<div class="nav"><div><i></i>Account</div><div class="on"><i></i>Calendar</div><div><i></i>Event</div><div><i></i>Food</div><div><i></i>Societies</div></div>
